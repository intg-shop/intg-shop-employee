<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#183d37" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Page not found · Intg Shop</title>
    <style>
      :root {
        color: #183d37;
        background: #f3eee3;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #f3eee3;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }

      .story {
        position: relative;
        display: flex;
        min-height: 38vh;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 26px;
        background: #183d37;
        color: #fff8ed;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        text-decoration: none;
      }

      .mark {
        position: relative;
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        transform: rotate(-4deg);
      }

      .mark::before, .mark::after, .mark i {
        position: absolute;
        width: 22px;
        height: 5px;
        border-radius: 5px;
        background: currentColor;
        content: "";
      }

      .mark::before { transform: rotate(60deg); }
      .mark::after { transform: rotate(-60deg); }
      .mark i:first-child { transform: translateY(-9px); }
      .mark i:nth-child(2) { transform: translate(8px, 5px) rotate(60deg); }
      .mark i:last-child { transform: translate(-8px, 5px) rotate(-60deg); }
      .brand b, .brand small { display: block; line-height: 1; }
      .brand b { font-size: 1.1rem; letter-spacing: .18em; }
      .brand small { margin-top: 5px; font-size: .56rem; letter-spacing: .19em; opacity: .65; }

      .number {
        position: relative;
        z-index: 1;
        margin: 58px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(8rem, 42vw, 12rem);
        font-weight: 400;
        letter-spacing: -.09em;
        line-height: .72;
      }

      .number::after {
        position: absolute;
        z-index: -1;
        right: -18%;
        bottom: -48%;
        width: clamp(220px, 34vw, 480px);
        height: clamp(220px, 34vw, 480px);
        border: 1px solid rgba(255, 255, 255, .13);
        border-radius: 50%;
        box-shadow: 0 0 0 62px rgba(255,255,255,.025), 0 0 0 126px rgba(255,255,255,.018);
        content: "";
      }

      .story p {
        display: none;
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 48px 0 0;
        color: #92aba3;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.1rem;
        line-height: 1.55;
      }

      .message {
        display: grid;
        width: min(440px, 100%);
        min-height: 62vh;
        place-self: center;
        gap: 22px;
        padding: 50px 24px calc(50px + env(safe-area-inset-bottom));
      }

      .eyebrow {
        margin: 0;
        color: #778681;
        font-size: .66rem;
        font-weight: 900;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 410px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.8rem, 6vw, 4.8rem);
        font-weight: 400;
        letter-spacing: -.045em;
        line-height: .96;
      }

      .message > p:not(.eyebrow) {
        max-width: 380px;
        margin: 0;
        color: #6c7c77;
        line-height: 1.7;
      }

      .button {
        display: flex;
        width: min(280px, 100%);
        min-height: 50px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-radius: 3px;
        padding: 0 18px;
        background: #e96e46;
        color: white;
        font-size: .83rem;
        font-weight: 800;
        text-decoration: none;
        transition: transform .16s, background .16s, box-shadow .16s;
      }

      .button:hover { transform: translateY(-1px); background: #c95331; box-shadow: 0 8px 22px rgba(233,110,70,.2); }
      .button:focus-visible { outline: 3px solid rgba(233,110,70,.4); outline-offset: 3px; }

      @media (min-width: 721px) {
        main { grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr); }
        .story { min-height: 100vh; padding: clamp(28px, 6vw, 76px); }
        .number { margin-top: 48px; font-size: clamp(9rem, 24vw, 21rem); }
        .number::after { right: -12%; bottom: -34%; }
        .story p { display: block; }
        .message { min-height: auto; padding: 45px 28px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="story" aria-hidden="true">
        <span class="brand">
          <span class="mark"><i></i><i></i><i></i></span>
          <span><b>INTG</b><small>EMPLOYEE DESK</small></span>
        </span>
        <div class="number">404</div>
        <p>This page is off the schedule. Today’s bookings are still waiting safely at the desk.</p>
      </section>
      <section class="message">
        <p class="eyebrow">Page not found</p>
        <h1>Nothing scheduled here.</h1>
        <p>The address may be incomplete or the page may have moved. Return to the desk to continue.</p>
        <a class="button" href="/">Back to Employee Desk <span aria-hidden="true">→</span></a>
      </section>
    </main>
  </body>
</html>
